services:
  - type: web
    name: campusai
    env: python
    plan: free
    region: singapore
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PLANET_API_KEY
        sync: false
